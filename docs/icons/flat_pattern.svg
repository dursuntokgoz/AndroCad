<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Unfolded Flat Sheet Perimeter (Cut boundary) -->
  <rect x="6" y="10" width="36" height="28" rx="1" stroke="#007ACC" fill="#007ACC" fill-opacity="0.15" />
  <!-- Bend Line 1 (Left flange fold line) -->
  <line x1="16" y1="10" x2="16" y2="38" stroke="#FF9800" stroke-width="2" stroke-dasharray="3 2" />
  <!-- Bend Line 2 (Right flange fold line) -->
  <line x1="32" y1="10" x2="32" y2="38" stroke="#FF9800" stroke-width="2" stroke-dasharray="3 2" />
  <!-- Unfolding Arrows -->
  <path d="M 12,24 L 8,24 M 9,21 L 6,24 L 9,27" stroke="#4CAF50" stroke-width="2" />
  <path d="M 36,24 L 40,24 M 39,21 L 42,24 L 39,27" stroke="#4CAF50" stroke-width="2" />
</svg>
