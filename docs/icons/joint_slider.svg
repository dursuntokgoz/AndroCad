<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Prismatic rail -->
  <line x1="6" y1="24" x2="42" y2="24" stroke="#454950" stroke-width="4" stroke-linecap="square" />
  <!-- Moving carriage block -->
  <rect x="18" y="16" width="12" height="16" rx="2" stroke="#007ACC" stroke-width="2" fill="#007ACC" fill-opacity="0.25" />
  <!-- Bi-directional slide arrows -->
  <line x1="8" y1="36" x2="40" y2="36" stroke="#00A4E4" stroke-width="2" />
  <polyline points="12,32 8,36 12,40" stroke="#00A4E4" stroke-width="2" />
  <polyline points="36,32 40,36 36,40" stroke="#00A4E4" stroke-width="2" />
</svg>
