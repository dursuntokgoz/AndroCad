<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Sheet Frame -->
  <rect x="4" y="6" width="40" height="36" rx="2" stroke="#007ACC" fill="#007ACC" fill-opacity="0.1" />
  <!-- Title Block at bottom-right -->
  <rect x="28" y="32" width="16" height="10" stroke="#007ACC" fill="#1E2124" />
  <!-- View 1: Top View (Top Left) -->
  <rect x="8" y="10" width="14" height="10" stroke="#00A4E4" fill="#00A4E4" fill-opacity="0.2" />
  <!-- View 2: Front View (Bottom Left) -->
  <rect x="8" y="24" width="14" height="10" stroke="#00A4E4" fill="#00A4E4" fill-opacity="0.2" />
  <!-- View 3: Isometric 3D Projection (Top Right) -->
  <polygon points="30,12 38,8 42,14 34,18" stroke="#FF9800" fill="#FF9800" fill-opacity="0.2" />
  <polygon points="30,12 34,18 34,24 30,18" stroke="#FF9800" fill="#1E2124" />
  <polygon points="34,18 42,14 42,20 34,24" stroke="#FF9800" fill="#2F3136" />
</svg>
