<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Cantilever Beam Dynamic Mode Shape -->
  <path d="M2 5v14" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base anchor lines -->
  <path d="M2 7l-2 2m2 3l-2 2m2 3l-2 2" stroke="#718096" stroke-width="1.2"/>
  <!-- Undeformed centerline -->
  <path d="M2 12h20" stroke="#718096" stroke-width="1.2" stroke-dasharray="2,2"/>
  <!-- Mode 1 bending curve -->
  <path d="M2 12C8 12 14 6 22 4" stroke="#00ADB5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Downward counter wave (harmonic oscillation) -->
  <path d="M2 12C8 12 14 18 22 20" stroke="#FFA726" stroke-width="1.6" stroke-dasharray="2,2" stroke-linecap="round"/>
  <!-- Amplitude displacement arrow -->
  <path d="M22 6v12m-2-2l2 2 2-2m-4-8l2-2 2 2" stroke="#FF5252" stroke-width="1.4" stroke-linecap="round"/>
</svg>
