<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Component 1: Base cube -->
  <polygon points="10,28 20,22 30,28 20,34" stroke="#007ACC" fill="#007ACC" fill-opacity="0.2" />
  <polygon points="10,28 20,34 20,44 10,38" stroke="#007ACC" fill="#1E2124" />
  <polygon points="20,34 30,28 30,38 20,44" stroke="#007ACC" fill="#2F3136" />
  <!-- Component 2: Mating upper cube -->
  <polygon points="20,14 30,8 40,14 30,20" stroke="#00A4E4" fill="#00A4E4" fill-opacity="0.3" />
  <polygon points="20,14 30,20 30,30 20,24" stroke="#00A4E4" fill="#1E2124" />
  <polygon points="30,20 40,14 40,24 30,30" stroke="#00A4E4" fill="#2F3136" />
  <!-- Assembly alignment pin line -->
  <line x1="20" y1="34" x2="30" y2="20" stroke="#FF9800" stroke-width="2" stroke-dasharray="2 2" />
</svg>
