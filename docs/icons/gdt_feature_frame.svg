<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Reference Part Surface & Datum Triangle -->
  <line x1="4" y1="42" x2="44" y2="42" stroke="#6C757D" stroke-width="2" />
  <polygon points="12,42 8,36 16,36" fill="#007ACC" stroke="#007ACC" />
  <line x1="12" y1="36" x2="12" y2="30" stroke="#007ACC" />
  <rect x="7" y="24" width="10" height="6" fill="#1E2124" stroke="#007ACC" />
  <text x="12" y="28.5" font-family="monospace" font-size="5" font-weight="bold" fill="#00A4E4" text-anchor="middle" stroke="none">A</text>

  <!-- GD&T Feature Control Frame -->
  <rect x="4" y="8" width="40" height="14" rx="1.5" fill="#1E2124" stroke="#007ACC" stroke-width="1.6" />
  <!-- Divider lines -->
  <line x1="15" y1="8" x2="15" y2="22" stroke="#007ACC" stroke-width="1.4" />
  <line x1="28" y1="8" x2="28" y2="22" stroke="#007ACC" stroke-width="1.4" />
  <line x1="36" y1="8" x2="36" y2="22" stroke="#007ACC" stroke-width="1.4" />

  <!-- Compartment 1: True Position Symbol (Crosshairs & Circle) -->
  <circle cx="9.5" cy="15" r="4" stroke="#FF9800" stroke-width="1.3" fill="none" />
  <line x1="9.5" y1="9.5" x2="9.5" y2="20.5" stroke="#FF9800" stroke-width="1.3" />
  <line x1="4" y1="15" x2="15" y2="15" stroke="#FF9800" stroke-width="1.3" />

  <!-- Compartment 2: Diameter & Tolerance Value -->
  <text x="17.5" y="16.5" font-family="monospace" font-size="4.5" fill="#4CAF50" stroke="none">⌀.05</text>
  <circle cx="25.5" cy="14" r="1.8" stroke="#4CAF50" stroke-width="0.8" fill="none" />
  <text x="25.5" y="15.2" font-family="sans-serif" font-size="2.2" font-weight="bold" fill="#4CAF50" text-anchor="middle" stroke="none">M</text>

  <!-- Compartment 3: Primary Datum A -->
  <text x="32" y="17" font-family="monospace" font-size="5" font-weight="bold" fill="#00A4E4" text-anchor="middle" stroke="none">A</text>

  <!-- Compartment 4: Secondary Datum B -->
  <text x="40" y="17" font-family="monospace" font-size="5" font-weight="bold" fill="#00A4E4" text-anchor="middle" stroke="none">B</text>

  <!-- Leader Line from Frame to Target Surface -->
  <polyline points="24,22 24,30 34,38 34,42" stroke="#007ACC" stroke-width="1.4" />
  <polygon points="34,42 32,38 36,38" fill="#007ACC" stroke="#007ACC" />
