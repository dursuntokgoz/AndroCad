<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Parent View Feature Section -->
  <path d="M 6 36 L 14 36 L 14 28 L 22 28 L 22 36 L 30 36" stroke="#6C757D" stroke-width="1.8" />

  <!-- Circular Detail Boundary (Dashed) -->
  <circle cx="18" cy="30" r="10" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
  <text x="26" y="22" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FF9800" stroke="none">A</text>

  <!-- Leader Line from Parent Detail Circle to Enlarged View -->
  <path d="M 24 24 Q 28 16 34 16" stroke="#FF9800" stroke-width="1.4" fill="none" />

  <!-- Enlarged Detail View Circle (Solid Blue) -->
  <circle cx="34" cy="16" r="11" fill="#1E2124" stroke="#00A4E4" stroke-width="2" />

  <!-- Magnified Feature Geometry inside Detail View -->
  <path d="M 28 22 L 32 22 L 32 14 L 38 14 L 38 22 L 42 22" stroke="#00A4E4" stroke-width="2" />

  <!-- Scale Label Text -->
  <text x="34" y="32" font-family="sans-serif" font-size="3.2" font-weight="bold" fill="#00A4E4" text-anchor="middle" stroke="none">2:1</text>
</svg>
